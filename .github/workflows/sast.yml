name: SAST

on:
  pull_request: {}
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions: {}

jobs:
  semgrep:
    name: Semgrep SAST
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      # required for all workflows
      security-events: write
      # only required for workflows in private repositories
      actions: read
      contents: read

    if: (github.actor != 'dependabot[bot]')

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Kong/public-shared-actions/security-actions/semgrep@a18abf762d6e2444bcbfd20de70451ea1e3bc1b1 # semgrep@4.0.1 (4.0.4 fails: semgrep needs pkg_resources)
